version: "3.9"

services:
  backend:
    image: dharmu86/bitnova-backend:0.1.0
    container_name: bitnova-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads
    networks:
      - bitnova-network

  frontend:
    image: dharmu86/bitnova-frontend:0.1.0
    container_name: bitnova-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env.production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - bitnova-network

  admin-web:
    image: dharmu86/bitnova-admin-web:0.1.0
    container_name: bitnova-admin-web
    restart: unless-stopped
    env_file:
      - ./admin-web/.env.production
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - bitnova-network

  postgres:
    image: postgres:17
    container_name: bitnova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bitnova
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bitnova-network

  redis:
    image: redis:7-alpine
    container_name: bitnova-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - bitnova-network

volumes:
  postgres_data:
  redis_data:
  backend_logs:
  backend_uploads:

networks:
  bitnova-network:
    driver: bridge